name: ARA2 VST3 Build

on:
  push:
    branches: [ feature/ara2-integration ]
  workflow_dispatch:

jobs:
  build-vst3-ara:
    name: Windows VST3 (ARA2)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ==========================================
      # 依赖下载
      # ==========================================

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            JUCE_ARA-master
            onnxruntime-dml-1.24.4
            onnxruntime-win-x64-1.24.4
          key: ara2-deps-${{ runner.os }}-juce-ara-onnx1.24.4

      - name: Download JUCE_ARA Framework (if not cached)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          # Download JUCE_ARA develop branch
          $juceUrl = "https://github.com/Celemony/JUCE_ARA/archive/refs/heads/develop.zip"
          $juceZip = "juce-ara.zip"
          Invoke-WebRequest -Uri $juceUrl -OutFile $juceZip
          Expand-Archive -Path $juceZip -DestinationPath "." -Force
          Rename-Item -Path "JUCE_ARA-develop" -NewName "JUCE_ARA-master" -Force
          Remove-Item $juceZip
          Write-Output "JUCE_ARA downloaded (develop branch)"
        shell: pwsh

      - name: Clone ARA SDK
        run: |
          git clone --branch releases/2.2.0 --depth 1 https://github.com/Celemony/ARA_SDK.git ARA_SDK
          cd ARA_SDK
          git submodule update --init --recursive
          cd ..
          Write-Output "ARA SDK cloned (releases/2.2.0)"
          Get-ChildItem ARA_SDK -Directory | Select-Object Name
        shell: pwsh

      - name: Patch JUCE_ARA isTimestretchReflectingTempo
        run: |
          $file = "JUCE_ARA-master/modules/juce_audio_formats/format/juce_ARAAudioReaders.cpp"
          $content = Get-Content $file -Raw
          # Comment out isTimestretchReflectingTempo call (ARA SDK 2.2.0 doesn't have this method)
          $content = $content -replace 'playbackRegion->isTimestretchReflectingTempo\(\)', 'false /* isTimestretchReflectingTempo - requires newer ARA SDK */'
          Set-Content -Path $file -Value $content -NoNewline
          Write-Output "Patched juce_ARAAudioReaders.cpp"
        shell: pwsh

      - name: Download ONNX Runtime (if not cached)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          $ortDmlNupkgUrl = "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime.directml/1.24.4/microsoft.ml.onnxruntime.directml.1.24.4.nupkg"
          $ortDmlNupkg = "onnxruntime-dml.nupkg"
          Invoke-WebRequest -Uri $ortDmlNupkgUrl -OutFile $ortDmlNupkg
          New-Item -ItemType Directory -Force -Path "onnxruntime-dml-1.24.4-temp"
          Expand-Archive -Path $ortDmlNupkg -DestinationPath "onnxruntime-dml-1.24.4-temp" -Force
          Remove-Item $ortDmlNupkg
          if (Test-Path "onnxruntime-dml-1.24.4") { Remove-Item "onnxruntime-dml-1.24.4" -Recurse -Force }
          Rename-Item "onnxruntime-dml-1.24.4-temp" "onnxruntime-dml-1.24.4"

          $ortUrl = "https://github.com/microsoft/onnxruntime/releases/download/v1.24.4/onnxruntime-win-x64-1.24.4.zip"
          $ortZip = "onnxruntime-cpu.zip"
          Invoke-WebRequest -Uri $ortUrl -OutFile $ortZip
          Expand-Archive -Path $ortZip -DestinationPath "." -Force
          Remove-Item $ortZip
        shell: pwsh

      # ==========================================
      # 构建
      # ==========================================

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.22'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake (VST3 + ARA)
        run: |
          mkdir build-ara-vst3
          cd build-ara-vst3
          cmake .. -G "Visual Studio 17 2022" -A x64 `
            -DOPENTUNE_FORMATS=VST3 `
            -DOPENTUNE_ARA_SDK_PATH="${{ github.workspace }}/ARA_SDK"
        shell: pwsh

      - name: Build VST3 (ARA)
        run: |
          cd build-ara-vst3
          cmake --build . --config Release
        shell: pwsh

      - name: Upload VST3 (ARA) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenTune-VST3-ARA2
          path: build-ara-vst3/OpenTune_artefacts/Release/VST3/
          retention-days: 30
