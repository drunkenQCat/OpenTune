name: Dev Build (Standalone Only)

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  # ==========================================
  # Windows Standalone
  # ==========================================
  build-windows:
    name: Windows Standalone
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            JUCE-master
            onnxruntime-dml-1.24.4
            onnxruntime-win-x64-1.24.4
          key: deps-Windows-juce8.0.12-onnx1.24.4-asio
          restore-keys: |
            deps-Windows-juce8.0.12-onnx1.24.4-asio
            deps-Windows-

      - name: Download JUCE Framework (if not cached)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          $juceUrl = "https://github.com/juce-framework/JUCE/archive/refs/tags/8.0.12.zip"
          $juceZip = "juce-8.0.12.zip"
          Invoke-WebRequest -Uri $juceUrl -OutFile $juceZip
          Expand-Archive -Path $juceZip -DestinationPath "." -Force
          Rename-Item -Path "JUCE-8.0.12" -NewName "JUCE-master" -Force
          Remove-Item $juceZip
        shell: pwsh

      - name: Download ASIO SDK (if not cached)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          $asioUrl = "https://github.com/audiosdk/asio/archive/refs/heads/master.zip"
          $asioZip = "asio-sdk.zip"
          Invoke-WebRequest -Uri $asioUrl -OutFile $asioZip
          Expand-Archive -Path $asioZip -DestinationPath "." -Force
          Remove-Item $asioZip
          $asioRoot = Get-ChildItem -Directory | Where-Object { $_.Name -like "asio-*" } | Select-Object -First 1
          if (-not $asioRoot) { throw "ASIO SDK not found" }
          $asioDest = "JUCE-master\modules\juce_audio_devices\native\asio"
          New-Item -ItemType Directory -Force -Path $asioDest
          Copy-Item "$($asioRoot.FullName)\common\*" $asioDest -Recurse -Force
          Copy-Item "$($asioRoot.FullName)\asio\*" $asioDest -Recurse -Force
          Copy-Item "$($asioRoot.FullName)\host\*" $asioDest -Recurse -Force
          Remove-Item $asioRoot.FullName -Recurse -Force
        shell: pwsh

      - name: Download ONNX Runtime (if not cached)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          $ortDmlNupkgUrl = "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime.directml/1.24.4/microsoft.ml.onnxruntime.directml.1.24.4.nupkg"
          $ortDmlNupkg = "onnxruntime-dml.nupkg"
          Invoke-WebRequest -Uri $ortDmlNupkgUrl -OutFile $ortDmlNupkg
          New-Item -ItemType Directory -Force -Path "onnxruntime-dml-1.24.4-temp"
          Expand-Archive -Path $ortDmlNupkg -DestinationPath "onnxruntime-dml-1.24.4-temp" -Force
          Remove-Item $ortDmlNupkg
          if (Test-Path "onnxruntime-dml-1.24.4") { Remove-Item "onnxruntime-dml-1.24.4" -Recurse -Force }
          Rename-Item "onnxruntime-dml-1.24.4-temp" "onnxruntime-dml-1.24.4"

          $ortUrl = "https://github.com/microsoft/onnxruntime/releases/download/v1.24.4/onnxruntime-win-x64-1.24.4.zip"
          $ortZip = "onnxruntime-cpu.zip"
          Invoke-WebRequest -Uri $ortUrl -OutFile $ortZip
          Expand-Archive -Path $ortZip -DestinationPath "." -Force
          Remove-Item $ortZip
        shell: pwsh

      - name: Cache Build Directory
        id: cache-build
        uses: actions/cache@v4
        with:
          path: build-windows
          key: Windows-build-${{ hashFiles('CMakeLists.txt', 'Source/**') }}
          restore-keys: |
            Windows-build-${{ hashFiles('CMakeLists.txt') }}-
            Windows-build-

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.22'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure and Build
        run: |
          New-Item -ItemType Directory -Force -Path "build-windows"
          cd build-windows
          if (!(Test-Path CMakeCache.txt)) {
            cmake .. -G "Visual Studio 17 2022" -A x64 -DOPENTUNE_FORMATS=Standalone
          }
          cmake --build . --config Release
        shell: pwsh

      - name: Upload OpenTune.exe
        uses: actions/upload-artifact@v4
        with:
          name: OpenTune-dev-windows-exe
          path: build-windows/OpenTune_artefacts/Release/Standalone/OpenTune.exe
          retention-days: 7

  # ==========================================
  # macOS Standalone (arm64 only)
  # ==========================================
  build-macos:
    name: macOS Standalone (arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            JUCE-master
            onnxruntime-osx-arm64-1.24.4
          key: deps-macOS-juce8.0.12-onnx1.24.4-arm64
          restore-keys: |
            deps-macOS-juce8.0.12-onnx1.24.4-arm64
            deps-macOS-

      - name: Download JUCE Framework (if not cached)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          curl -L -o juce-8.0.12.zip https://github.com/juce-framework/JUCE/archive/refs/tags/8.0.12.zip
          unzip -q juce-8.0.12.zip
          mv JUCE-8.0.12 JUCE-master
          rm juce-8.0.12.zip

      - name: Download ONNX Runtime (if not cached)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          curl -L -o onnxruntime-macos.tar.gz https://github.com/microsoft/onnxruntime/releases/download/v1.24.4/onnxruntime-osx-arm64-1.24.4.tgz
          tar -xzf onnxruntime-macos.tar.gz
          rm onnxruntime-macos.tar.gz

      - name: Cache Build Directory
        id: cache-build
        uses: actions/cache@v4
        with:
          path: build-macos
          key: macOS-build-${{ hashFiles('CMakeLists.txt', 'Source/**') }}
          restore-keys: |
            macOS-build-${{ hashFiles('CMakeLists.txt') }}-
            macOS-build-

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.22'

      - name: Select Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Build Standalone
        run: |
          mkdir build-macos
          cd build-macos
          cmake .. -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DOPENTUNE_FORMATS=Standalone
          cmake --build . --config Release -j$(sysctl -n hw.ncpu)

      - name: Upload OpenTune.app
        uses: actions/upload-artifact@v4
        with:
          name: OpenTune-dev-macos-app
          path: build-macos/OpenTune_artefacts/Release/Standalone/OpenTune.app
          retention-days: 7
